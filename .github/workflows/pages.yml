name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'websites/**'
      - 'pace-sdk/results/**'
      - 'pace-analyzer/results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The deployment needs two permissions: contents: write to publish the
# gh-pages branch, and id-token: write so the deployment can request the
# OIDC token that GitHub Pages verifies. Without the second one the
# deploy step fails with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/pace/package-lock.json

      # The site renders every figure from the two committed measurement
      # artifacts, so a build without them fails on purpose rather than
      # shipping a page with a blank where a measurement belongs.
      - name: Check that the measurement artifacts are present
        run: |
          for artifact in pace-sdk/results/accuracy.json \
                          pace-analyzer/results/real-trace-report.txt; do
            if [ ! -f "$artifact" ]; then
              echo "::error::the site publishes numbers from $artifact, which is missing"
              exit 1
            fi
          done
          echo "both measurement artifacts are present"

      - name: Build the site
        working-directory: websites/pace
        run: |
          npm ci
          npm run build

      - name: Check that no built page contains a placeholder
        working-directory: websites/pace
        run: |
          if grep -rniE 'lorem ipsum|TODO|FIXME|placeholder text|coming soon' \
               dist --include='*.html'; then
            echo "::error::a built page contains placeholder content"
            exit 1
          fi
          echo "no placeholder content in the built site"

      - name: Check that no built page carries an invented contact detail
        working-directory: websites/pace
        run: |
          # A demo address on a product site is a message nobody receives.
          if grep -rnE 'pace@devansh0703\.dev|example\.com|@example\.org' \
               dist --include='*.html'; then
            echo "::error::a built page carries a placeholder address"
            exit 1
          fi
          grep -q 'devanshraulo@gmail.com' dist/about/index.html
          echo "the real address is the only one on the site"

      - name: Check the site against the design contract
        working-directory: websites
        run: python3 scripts/check_design_contract.py

      - name: Check that the built page matches the measurement artifact
        working-directory: websites
        run: python3 scripts/check_site_accuracy.py

      # GitHub Pages serves a project site from /<repo>/, so the built
      # artifact IS the site root: the tree published here is served from
      # /PACE/ without a PACE/ directory of its own. A directory of that
      # name would be served from /PACE/PACE/.
      - name: Check that every internal link carries the base path
        working-directory: websites/pace
        run: |
          # An asset or link referenced from the domain root would 404 on the
          # deployed site, because the site is served from /PACE/.
          if grep -rhoE '(src|href)="/[^"]*"' dist --include='*.html' \
               | grep -v '"/PACE/' ; then
            echo "::error::a built page references the domain root"
            exit 1
          fi
          grep -q '/PACE/_astro/' dist/index.html
          echo "every internal link carries the base path"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: websites/pace/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
