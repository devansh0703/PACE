name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- the SDK
  sdk:
    name: SDK / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev linux-tools-common linux-tools-generic \
            pkg-config

      - name: Install the Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y ninja pkgconfiglite

      - name: Install the macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        working-directory: pace-sdk
        # The Windows runner defaults to PowerShell, where a backslash is
        # not a line continuation, so the multi-line commands need bash.
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_TESTS=ON \
            -DPACE_BUILD_BENCH=ON \
            -DPACE_ENABLE_BPF=ON

      - name: Configure the macOS build without the benchmark
        if: runner.os == 'macOS'
        working-directory: pace-sdk
        shell: bash
        run: |
          # The Google Benchmark dependency does not build on every
          # platform, and the benchmark is not part of the contract.
          rm -rf build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_TESTS=ON \
            -DPACE_BUILD_BENCH=OFF \
            -DPACE_ENABLE_BPF=ON

      - name: Build
        working-directory: pace-sdk
        run: cmake --build build -j 4

      - name: Run the unit tests
        working-directory: pace-sdk
        run: |
          cd build
          ctest --output-on-failure

      - name: Install
        working-directory: pace-sdk
        run: cmake --install build --prefix "${{ github.workspace }}/install"

      - name: Build with the thread sanitizer
        if: runner.os != 'Windows'
        working-directory: pace-sdk
        shell: bash
        run: |
          # The library promises that sampling is safe from several threads
          # at once. A data race there produces a wrong number rather than
          # a crash, so the promise is checked under a thread sanitizer.
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPACE_SANITIZER=thread -DPACE_ENABLE_BPF=OFF -DPACE_BUILD_BENCH=OFF
          cmake --build build-tsan -j 4

      - name: Run the tests under the thread sanitizer
        if: runner.os != 'Windows'
        working-directory: pace-sdk
        shell: bash
        run: |
          for t in pace_unit_tests pace_lifecycle_tests pace_primitive_tests \
                   pace_concurrency_tests; do
            echo "--- $t"
            ./build-tsan/$t
          done

      - name: Build with the address sanitizer
        if: runner.os != 'Windows'
        working-directory: pace-sdk
        shell: bash
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPACE_SANITIZER=address -DPACE_ENABLE_BPF=OFF -DPACE_BUILD_BENCH=OFF
          cmake --build build-asan -j 4

      - name: Run the tests under the address sanitizer
        if: runner.os != 'Windows'
        working-directory: pace-sdk
        shell: bash
        run: |
          for t in pace_unit_tests pace_lifecycle_tests pace_primitive_tests \
                   pace_concurrency_tests; do
            echo "--- $t"
            ./build-asan/$t
          done

      - name: Verify a consumer can find_package() the installed package
        shell: bash
        working-directory: pace-sdk
        run: |
          # The check runs in the runner's temp directory, not in the
          # source tree: a consumer project written into the SDK's
          # directory would pollute the source, and the build directory
          # it creates would not be covered by .gitignore.
          CHECK_DIR="$(mktemp -d)"
          cat > "$CHECK_DIR/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(pace_install_check LANGUAGES C)
          find_package(pace REQUIRED)
          add_executable(check main.c)
          target_link_libraries(check PRIVATE pace::pace)
          EOF
          cat > "$CHECK_DIR/main.c" <<'EOF'
          #include <pace/pace.h>
          #include <stdio.h>
          int main(void) {
            pace_config cfg;
            pace_config_init(&cfg);
            pace_session *session = NULL;
            if (pace_session_create(&cfg, &session) != PACE_OK) return 1;
            pace_sample sample;
            pace_session_sample_self(session, &sample);
            printf("on_cpu_ns=%llu\n", (unsigned long long)sample.on_cpu_ns);
            pace_session_destroy(session);
            return 0;
          }
          EOF
          cmake -S "$CHECK_DIR" -B "$CHECK_DIR/build" -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          cmake --build "$CHECK_DIR/build"
          "$CHECK_DIR/build/check"

  # ------------------------------------------------------------- the analyzer
  analyzer:
    name: Analyzer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        working-directory: pace-analyzer
        run: cargo fmt --check

      - name: Lint
        working-directory: pace-analyzer
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: pace-analyzer
        run: cargo build --release

      - name: Test
        working-directory: pace-analyzer
        run: cargo test --release

  # ------------------------------------------------------- the verification
  accuracy:
    name: Accuracy harness
    runs-on: ubuntu-24.04
    needs: sdk

    steps:
      - uses: actions/checkout@v4

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-generic

      - name: Build the SDK
        working-directory: pace-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_BENCH=OFF -DPACE_ENABLE_BPF=ON
          cmake --build build -j 4

      - name: Turn on the kernel's scheduler statistics
        run: |
          # The kernel collects the run-queue delay only while the
          # scheduler statistics are on. A distribution kernel compiles
          # in CONFIG_TASK_DELAY_ACCT without CONFIG_SCHEDSTATS, and the
          # delayacct toggle is off by default, so
          # /proc/<tid>/schedstat reads "0 0 0" and the preemption is
          # reported as zero on a machine where the threads are
          # preempted constantly.
          #
          # With them on, the measurement is available and the check
          # against perf is meaningful.
          if [ -w /proc/sys/kernel/task_delayacct ]; then
            echo 1 > /proc/sys/kernel/task_delayacct
            echo "the scheduler statistics are now on"
          elif [ -e /proc/sys/kernel/sched_schedstats ]; then
            echo "CONFIG_SCHEDSTATS is compiled in; the statistics are always on"
          else
            echo "::warning::this kernel does not collect the scheduler statistics, so the preemption split is unavailable and the check against perf will be skipped"
          fi

      - name: Run the accuracy harness
        working-directory: pace-sdk
        run: |
          # The harness imports nothing outside the standard library, so
          # there is nothing to install. It runs the SDK's in-process
          # verifier and compares against the kernel's own accounting.
          #
          # It needs root for the perf-sched cross-checks, because
          # perf's scheduler tracing is privileged. Without it those
          # checks skip.
          #
          # The artifact goes to a path OUTSIDE the repository, so the
          # runner's measurement cannot overwrite the committed one. The
          # two are different measurements: this one is on the runner's
          # hardware, and the committed one is on the machine the
          # measurement was made on. Both are correct, and a CI run on
          # different hardware must not be expected to reproduce the
          # committed figures -- so the committed artifact is left alone
          # and checked separately.
          sudo -n python3 tests/verify/verify_accuracy.py \
            --repetitions 30 \
            --duration-ms 400 \
            --output "$RUNNER_TEMP/accuracy.json"

      - name: Check the documents' numbers against the committed artifact
        run: |
          # The same drift, in the documents. A number written by hand in
          # prose is a number that goes stale, and a stale number in a
          # document is a false claim.
          #
          # The checker reads the COMMITTED artifact, the one in the
          # checkout, which is the reproducible and reviewable
          # measurement. It is deliberately NOT the artifact the job
          # above just produced on the runner: that one is a measurement
          # of the runner's hardware, and the documents are not supposed
          # to quote it.
          python3 scripts/check_doc_numbers.py

      - name: Check that the documents' generator leaves them unchanged
        run: |
          # The generator rewrites the documents' figures from the
          # committed artifact. If running it changes anything, the
          # documents and the artifact disagree, and the check above says
          # so too. This is the same drift caught from the other side.
          python3 scripts/update_doc_numbers.py
          git diff --exit-code -- README.md PLAN.md pace-sdk/README.md \
            pace-sdk/docs/ACCURACY.md pace-sdk/docs/PREMISE-VERIFICATION.md

      - name: Check that the committed artifact still passes its own checks
        run: |
          # The committed artifact records whether the harness's checks
          # passed when it was produced. A committed artifact whose
          # checks failed is a committed false claim, and it must not
          # ship.
          python3 - <<'PY'
          import json, pathlib, sys
          artifact = json.loads(
              pathlib.Path("pace-sdk/results/accuracy.json").read_text())
          failed = [
              m["name"] for m in artifact["measurements"]
              if not m.get("skipped") and m.get("n", 0) > 0 and not m.get("passed", True)
          ]
          if failed:
              print("the committed artifact records a failed measurement:")
              for name in failed:
                  print(f"  {name}")
              sys.exit(1)
          print(f"the committed artifact records {len(artifact['measurements'])} "
                "measurements, all within their thresholds")
          PY

      - name: Publish the result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: ${{ runner.temp }}/accuracy.json

  # ---------------------------------------------------------------- websites
  websites:
    name: Websites
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/*/package-lock.json

      - name: Build the pace-sdk site
        working-directory: websites/pace-sdk
        run: |
          npm ci
          npm run build

      - name: Build the pace-analyzer site
        working-directory: websites/pace-analyzer
        run: |
          npm ci
          npm run build

      - name: Check that no site contains a placeholder
        working-directory: websites
        run: |
          # A site with a TODO, a lorem ipsum or an unfilled template is a
          # half-finished product and must not ship.
          if grep -rniE 'lorem ipsum|TODO|FIXME|placeholder text|coming soon' \
               */dist --include='*.html'; then
            echo "::error::a built page contains placeholder content"
            exit 1
          fi
          echo "no placeholder content in the built sites"

      - name: Check the sites against the design contract
        working-directory: websites
        run: python3 scripts/check_design_contract.py

      - name: Check that the site's accuracy table matches the artifact
        working-directory: websites
        run: |
          # The numbers on the site must come from the measurement harness.
          # A hand-typed copy is a number that drifts, and a drifted number
          # on a product site is a lie nobody notices.
          python3 scripts/check_site_accuracy.py
