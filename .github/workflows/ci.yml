name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- the SDK
  sdk:
    name: SDK / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev linux-tools-common linux-tools-generic \
            pkg-config

      - name: Install the Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y ninja pkgconfiglite

      - name: Install the macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure
        working-directory: pace-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_TESTS=ON \
            -DPACE_BUILD_BENCH=ON \
            -DPACE_ENABLE_BPF=ON

      - name: Configure the macOS build without the benchmark
        if: runner.os == 'macOS'
        working-directory: pace-sdk
        run: |
          # The Google Benchmark dependency does not build on every
          # platform, and the benchmark is not part of the contract.
          rm -rf build
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_TESTS=ON \
            -DPACE_BUILD_BENCH=OFF \
            -DPACE_ENABLE_BPF=ON

      - name: Build
        working-directory: pace-sdk
        run: cmake --build build -j 4

      - name: Run the unit tests
        working-directory: pace-sdk
        run: |
          cd build
          ctest --output-on-failure

      - name: Install
        working-directory: pace-sdk
        run: cmake --install build --prefix "${{ github.workspace }}/install"

      - name: Build with the thread sanitizer
        working-directory: pace-sdk
        run: |
          # The library promises that sampling is safe from several threads
          # at once. A data race there produces a wrong number rather than
          # a crash, so the promise is checked under a thread sanitizer.
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPACE_SANITIZER=thread -DPACE_ENABLE_BPF=OFF -DPACE_BUILD_BENCH=OFF
          cmake --build build-tsan -j 4

      - name: Run the tests under the thread sanitizer
        working-directory: pace-sdk
        run: |
          for t in pace_unit_tests pace_lifecycle_tests pace_primitive_tests \
                   pace_concurrency_tests; do
            echo "--- $t"
            ./build-tsan/$t
          done

      - name: Build with the address sanitizer
        working-directory: pace-sdk
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPACE_SANITIZER=address -DPACE_ENABLE_BPF=OFF -DPACE_BUILD_BENCH=OFF
          cmake --build build-asan -j 4

      - name: Run the tests under the address sanitizer
        working-directory: pace-sdk
        run: |
          for t in pace_unit_tests pace_lifecycle_tests pace_primitive_tests \
                   pace_concurrency_tests; do
            echo "--- $t"
            ./build-asan/$t
          done

      - name: Verify a consumer can find_package() the installed package
        shell: bash
        working-directory: pace-sdk
        run: |
          cat > consumer.cmake <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(pace_install_check LANGUAGES C)
          find_package(pace REQUIRED)
          add_executable(check main.c)
          target_link_libraries(check PRIVATE pace::pace)
          EOF
          cat > main.c <<'EOF'
          #include <pace/pace.h>
          #include <stdio.h>
          int main(void) {
            pace_config cfg;
            pace_config_init(&cfg);
            pace_session *session = NULL;
            if (pace_session_create(&cfg, &session) != PACE_OK) return 1;
            pace_sample sample;
            pace_session_sample_self(session, &sample);
            printf("on_cpu_ns=%llu\n", (unsigned long long)sample.on_cpu_ns);
            pace_session_destroy(session);
            return 0;
          }
          EOF
          cmake -S . -B check-build -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          cmake --build check-build
          ./check-build/check

  # ------------------------------------------------------------- the analyzer
  analyzer:
    name: Analyzer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        working-directory: pace-analyzer
        run: cargo fmt --check

      - name: Lint
        working-directory: pace-analyzer
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: pace-analyzer
        run: cargo build --release

      - name: Test
        working-directory: pace-analyzer
        run: cargo test --release

  # ------------------------------------------------------- the verification
  accuracy:
    name: Accuracy harness
    runs-on: ubuntu-24.04
    needs: sdk

    steps:
      - uses: actions/checkout@v4

      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-generic

      - name: Build the SDK
        working-directory: pace-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPACE_BUILD_BENCH=OFF -DPACE_ENABLE_BPF=ON
          cmake --build build -j 4

      - name: Run the accuracy harness
        working-directory: pace-sdk
        run: |
          # The harness imports nothing outside the standard library, so
          # there is nothing to install. It runs the SDK's in-process
          # verifier and compares against the kernel's own accounting.
          python3 tests/verify/verify_accuracy.py \
            --repetitions 30 \
            --duration-ms 400 \
            --output results/accuracy.json

      - name: Check the documents' numbers against the artifact
        run: |
          # The same drift, in the documents. A number written by hand in
          # prose is a number that goes stale, and a stale number in a
          # document is a false claim.
          #
          # The checker reads pace-sdk/results/accuracy.json, which the
          # job above has just regenerated.
          python3 scripts/check_doc_numbers.py

      - name: Check that the documents' generator leaves them unchanged
        run: |
          # The generator rewrites the documents' figures from the
          # artifact. If running it changes anything, the documents and
          # the artifact disagree, and the check above says so too. This
          # is the same drift caught from the other side.
          python3 scripts/update_doc_numbers.py
          git diff --exit-code -- README.md PLAN.md pace-sdk/README.md \
            pace-sdk/docs/ACCURACY.md pace-sdk/docs/PREMISE-VERIFICATION.md

      - name: Publish the result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: pace-sdk/results/accuracy.json

  # ---------------------------------------------------------------- websites
  websites:
    name: Websites
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: websites/*/package-lock.json

      - name: Build the pace-sdk site
        working-directory: websites/pace-sdk
        run: |
          npm ci
          npm run build

      - name: Build the pace-analyzer site
        working-directory: websites/pace-analyzer
        run: |
          npm ci
          npm run build

      - name: Check that no site contains a placeholder
        working-directory: websites
        run: |
          # A site with a TODO, a lorem ipsum or an unfilled template is a
          # half-finished product and must not ship.
          if grep -rniE 'lorem ipsum|TODO|FIXME|placeholder text|coming soon' \
               */dist --include='*.html'; then
            echo "::error::a built page contains placeholder content"
            exit 1
          fi
          echo "no placeholder content in the built sites"

      - name: Check the sites against the design contract
        working-directory: websites
        run: python3 scripts/check_design_contract.py

      - name: Check that the site's accuracy table matches the artifact
        working-directory: websites
        run: |
          # The numbers on the site must come from the measurement harness.
          # A hand-typed copy is a number that drifts, and a drifted number
          # on a product site is a lie nobody notices.
          python3 scripts/check_site_accuracy.py
