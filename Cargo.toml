[package]
name = "pace-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Attribution analyzer for PACE preemption-aware cycle traces"
license = "Apache-2.0"
repository = "https://github.com/devansh0703/pace-analyzer"
readme = "README.md"
keywords = ["profiling", "scheduler", "preemption", "attribution"]
categories = ["development-tools::profiling"]

[lib]
name = "pace_analyzer"
path = "src/lib.rs"

[[bin]]
name = "pace"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
